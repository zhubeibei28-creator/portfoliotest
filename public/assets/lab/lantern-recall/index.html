<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lantern Recall</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:white}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,54.074vh);height:auto;max-height:100vh;opacity:0;position:relative} .loading-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}</style><img class="loading-cover" src="cover.png" alt=""><canvas width="730" height="1350" aria-label="A pixel-based animation of two children hanging lanterns"></canvas><input hidden id="amount" value="75"><input hidden id="motion" value="75"><select hidden id="style"><option value="sequence">Auto</option></select><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),src=document.createElement('canvas'),sc=src.getContext('2d',{willReadFrequently:true}),im=new Image();src.width=c.width;src.height=c.height;let pixels,playing=true,time=0,last=0;const W=c.width,H=c.height,chars=' .:;+*xX#%@01';
const amount=document.querySelector('#amount'),motion=document.querySelector('#motion'),style=document.querySelector('#style');
function hash(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
// A smooth deformation field confines gesture and sway to the photographed forms.
function pose(x,y,t){let a=+motion.value/100,phase=t*.72,sway=Math.sin(phase),lift=(1-Math.cos(phase))*.5;let lantern=Math.exp(-((x-.63)**2/.075+(y-.24)**2/.035));let hand=Math.exp(-((x-.67)**2/.012+(y-.44)**2/.018));let arm=Math.exp(-((x-.64)**2/.022+(y-.52)**2/.022));let head=Math.exp(-((x-.74)**2/.02+(y-.53)**2/.015));return [a*(sway*26*lantern+lift*16*hand+lift*8*arm+sway*3*head),a*(Math.sin(phase+.6)*16*lantern-lift*28*hand-lift*12*arm)];}
function smooth(a,b,v){let u=Math.max(0,Math.min(1,(v-a)/(b-a)));return u*u*(3-2*u)}
function frame(ms){let dt=Math.min((ms-last)/1000,.05);last=ms;if(playing&&!document.hidden)time+=dt;if(pixels){let t=time,strength=+amount.value/100,phase=t%18,mode=style.value;
let dis=mode==='type'?1:mode==='pixel'?0:mode==='slice'?.65:smooth(3,8,phase)*(1-smooth(12,18,phase));let cut=mode==='slice'?1:mode==='sequence'?smooth(7,10,phase)*(1-smooth(12,16,phase)):.1;
ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);ctx.textBaseline='top';ctx.font='7px monospace';
for(let y=0;y<H;y+=6){let row=Math.floor(y/30),rn=hash(row,8),shift=cut*strength*(rn-.5)*100*Math.sin(t*.7+rn*6);for(let x=0;x<W;x+=6){let [dx,dy]=pose(x/W,y/H,t);let xx=Math.max(0,Math.min(W-1,Math.round(x-dx))),yy=Math.max(0,Math.min(H-1,Math.round(y-dy))),i=(yy*W+xx)*4,r=pixels[i],g=pixels[i+1],b=pixels[i+2],l=(r*.299+g*.587+b*.114)/255;let colored=b>r*1.2&&b>g*1.08||r>g*1.35&&r>b*1.2;let n=hash(x/6,y/6),wave=.5+.5*Math.sin(x*.012-y*.006-t*.7);let px=x+shift,py=y;
if(colored){let scatter=dis*strength*Math.pow(.5+.5*Math.sin(t*.85+y*.004),4);px+=Math.sin(n*6.283)*scatter*30;py+=Math.cos(n*6.283)*scatter*24;ctx.fillStyle=`rgb(${r},${g},${b})`;let sz=dis>.4?4+Math.floor(n*2):6;ctx.fillRect(px,py,sz,sz);if(dis>.45&&n>.9){ctx.fillStyle='#15151b';ctx.fillText('01/+*'[Math.floor(n*5)],px,py)}continue}
let tone=Math.max(0,Math.min(1,(l-.24)/.49));tone=tone*tone*(3-2*tone);let dissolve=dis*strength;let keep=1-tone*.88;if(n>keep&&n<dissolve*(.55+wave*.45))continue;
if(n<dissolve*.85){let ink=Math.round(tone*255);ctx.fillStyle=`rgb(${ink},${ink},${ink})`;let glyph=' .:+=x%#@'[Math.min(8,Math.floor((1-tone)*9))];ctx.fillText(glyph,px,py);if(n<.07&&tone<.5){ctx.fillStyle='rgba(30,31,35,.4)';ctx.fillRect(px,py+5,12+wave*30,.7)}}else{let gray=Math.round(tone*255);ctx.fillStyle=`rgb(${gray},${gray},${gray})`;ctx.fillRect(px,py,6,6)}
}}
// Architectural linework expands and recedes as the photograph opens into negative space.
ctx.lineWidth=.65;ctx.strokeStyle=`rgba(25,26,32,${dis*.22})`;for(let j=0;j<38;j++){let y=100+j*27,n=hash(j,2);ctx.beginPath();ctx.moveTo(n*W*.35,y);ctx.lineTo(n*W*.35+W*(.15+.45*dis),y);ctx.stroke()}
// Sparse blocks reinforce the grid, keeping the source blue and orange as the only accents.
for(let j=0;j<22;j++){let n=hash(j,19),x=hash(j,5)*W,y=hash(j,7)*H;let a=dis*strength*(.4+.6*Math.sin(t*.5+j)**2);ctx.globalAlpha=a;ctx.fillStyle=j%6===0?'#6878ff':j%9===0?'#ff6545':'#15161c';let size=j%5===0?12:3;ctx.fillRect(Math.floor(x/6)*6+cut*Math.sin(t+j)*18,Math.floor(y/6)*6,size,size)}ctx.globalAlpha=1;
}requestAnimationFrame(frame)}
im.onload=()=>{sc.drawImage(im,0,0,W,H);pixels=sc.getImageData(0,0,W,H).data;c.style.opacity=1;document.querySelector('.loading-cover').hidden=true};im.onerror=()=>console.error('Photo failed to load');im.src='cover.png';requestAnimationFrame(frame);
</script></html>
